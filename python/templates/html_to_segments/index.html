<!DOCTYPE html>
<HTML lang=en dir=ltr data-bs-theme="light" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="robots" content="noindex">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#eeeeee" media="(prefers-color-scheme: dark)" />
    <title>html then fix</title>
    <link href='https://tools-static.wmflabs.org/cdnjs/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css' rel='stylesheet'
        type='text/css'>
    <script src='https://tools-static.wmflabs.org/cdnjs/ajax/libs/jquery/3.7.1/jquery.min.js'></script>
    <script src='https://tools-static.wmflabs.org/cdnjs/ajax/libs/bootstrap/5.3.3/js/bootstrap.min.js'></script>
    <script src='{{ url_for('static', filename='js/html_to_segments.js')}}'></script>
</head>

<body>
    <header class="mb-3 border-bottom">
        <nav id="mainnav" class="navbar navbar-expand-lg shadow">
            <div class="container-fluid" id="navbardiv">
            </div>
        </nav>
    </header>
    <main id="body">
        <div id="maindiv" class="container">
            <div class="card">
                <div class="card-header aligncenter">
                    <div class='row'>
                        <div class='col-md-5'>
                            <b>/PageHtmlDomain/:domain/:title</b> (get) <span id="time_domain"></span><br> Html text
                        </div>
                        <div class='col-md-5'>
                            <div class='row cols-3' id="link_domain">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class='row'>
                        <div class='col-md-12'>
                            <div class='input-group mb-3'>
                                <textarea class='form-control' type='text' id='old_domain' name='old_domain'
                                    rows='4'></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header aligncenter">
                    <b>/HtmltoSegments</b> (post) <span id="time_fixit"></span><br>Html to Segments
                </div>
                <div class="card-body">
                    <div class='row'>
                        <div class='col-md-10'>
                            <input class='btn btn-outline-primary' size='10' name='start' value='fix it'
                                onclick="javascript:fix_it();" />
                            <span id="load_fixit" class="spinner-border spinner-border-sm" role="status"
                                aria-hidden="true" style="display:none;"></span>
                        </div>
                    </div>
                    <div class='row'>
                        <div class='col-md-12'>
                            <div class='input-group mb-3'>
                                <textarea class='form-control' type='text' id='new' name='new' rows='4'></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
